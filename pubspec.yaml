name: open_gmaps
description: Google Maps for OpenHarmony — Flutter + official Google Maps Platform SDKs (Maps JS, Places, Geocoding, Directions) with native OHOS location.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=2.19.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^1.2.0
  # Stock Google Maps widget; OHOS rendering comes from the backport below.
  google_maps_flutter: 2.12.3
  google_maps_flutter_ohos:
    path: packages/google_maps_flutter_ohos
  # Official Google Maps rendering on OHOS: Maps JavaScript API inside the
  # native OHOS WebView (ArkWeb) via the OHOS SIG WebView plugin.
  # There is no GMS / native Maps SDK binary for OpenHarmony, so the JS API
  # *is* the native-supported path here, bridged to Flutter.
  flutter_inappwebview:
    git:
      url: https://gitee.com/openharmony-sig/flutter_inappwebview.git
      path: flutter_inappwebview
      ref: bfc8e52cc9ba6e4f361bad95f7a6ee92a56ec6f6
  # OHOS rendering: official Google Maps Platform (Maps JS in the native
  # OHOS WebView via the backport below + Places/Geocoding/Directions
  # HTTPS). No tile scraping, no embed-HTML parsing.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSans-Italic.ttf
          style: italic
        - asset: assets/fonts/GoogleSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/GoogleSans-BoldItalic.ttf
          weight: 700
          style: italic
