name: open_gmaps
description: Google Maps adaptation for OpenHarmony and HarmonyOS — Flutter backport with HarmonyOS Design Language.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=2.19.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  # Google Maps Flutter — used natively on Android/iOS/Web
  # OHOS fallback: pure-Dart tile implementation (no native SDK required)
  google_maps_flutter: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
